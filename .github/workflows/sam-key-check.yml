name: SAM.gov key check
on:
  push:
    paths: [".github/workflows/sam-key-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"
          if [ -z "$KEY" ]; then echo "SAM_API_KEY secret: MISSING" >> $S; exit 0; fi
          echo "SAM_API_KEY secret: present (${#KEY} characters)" >> $S
          q(){ c=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 40 "$2"); echo "- $1: HTTP $c — $(head -c 160 /tmp/b | tr '\n' ' ' | sed "s/$KEY/***/g")" >> $S; }
          q "Exclusions API (official, tests the key)" "https://api.sam.gov/entity-information/v4/exclusions?api_key=$KEY&size=1"
          q "Opportunities API (official)" "https://api.sam.gov/opportunities/v2/search?api_key=$KEY&limit=1&postedFrom=11/01/2026&postedTo=11/22/2026&ncode=238210"
          q "Invalid key, for comparison" "https://api.sam.gov/entity-information/v4/exclusions?api_key=INVALID&size=1"
