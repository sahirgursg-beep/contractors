name: SAM.gov key check
on:
  push:
    paths: [".github/workflows/sam-key-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"
          if [ -z "$KEY" ]; then echo "SAM_API_KEY secret: MISSING" >> $S; exit 0; fi
          echo "SAM_API_KEY secret: present (${#KEY} characters)" >> $S
          q(){ c=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 40 "$2"); echo "- $1: HTTP $c — $(head -c 160 /tmp/b | tr '\n' ' ' | sed "s/$KEY/***/g")" >> $S; }
          q(){ c=$(curl -s -D /tmp/h -o /tmp/b -w "%{http_code}" --max-time 60 "$2"); echo "- $1: HTTP $c — $(python3 -c "import json;d=json.load(open('/tmp/b'));print('total',d.get('totalRecords'),'| sample naics',[x.get('naicsCode') for x in d.get('opportunitiesData',[])[:8]])" 2>/dev/null || head -c 200 /tmp/b | sed "s/$KEY/***/g") | limits: $(grep -i 'ratelimit\|x-rate\|retry' /tmp/h | tr '\r\n' '  ')" >> $S; }
          B="https://api.sam.gov/opportunities/v2/search?api_key=$KEY&postedFrom=11/20/2026&postedTo=11/20/2026&limit=10"
          q "One day, all NAICS" "$B"
          q "One day, ncode=23 (prefix?)" "$B&ncode=23"
          q "One day, ncode=238 (prefix?)" "$B&ncode=238"
