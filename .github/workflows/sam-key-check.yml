name: SAM.gov key check
on:
  push:
    paths: [".github/workflows/sam-key-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"
          if [ -z "$KEY" ]; then echo "SAM_API_KEY secret: MISSING" >> $S; exit 0; fi
          echo "SAM_API_KEY secret: present (${#KEY} characters)" >> $S
          q(){ c=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 40 -H "Accept: application/json" "$2"); echo "- $1: HTTP $c — $(head -c 160 /tmp/b | tr '\n' ' ' | sed "s/$KEY/***/g")" >> $S; }
          q "Exclusions API (official, tests the key)" "https://api.sam.gov/entity-information/v4/exclusions?api_key=$KEY&size=1"
          q "Wage determination via api.sam.gov (guess)" "https://api.sam.gov/prod/wdol/v1/wd/CA20260001/0?api_key=$KEY"
          q "Wage determination search via api.sam.gov (guess)" "https://api.sam.gov/prod/sgs/v1/search/?index=dbra&page=0&size=1&api_key=$KEY"
