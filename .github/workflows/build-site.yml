name: Build site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/build-site.yml"
  workflow_run:
    workflows: ["SBA size standards"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python site/build.py
      - name: Publish to the site branch (Hostinger deploys it)
        run: |
          cd dist
          git init -q -b site
          git config user.name "contractorrules-bot"
          git config user.email "contractorrules-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Site build from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
