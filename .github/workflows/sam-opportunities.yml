name: Federal construction opportunities

on:
  schedule:
    # Two runs a day keep the request count inside a personal SAM.gov key's daily limit.
    - cron: "37 7 * * *"
    - cron: "37 19 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Max SAM.gov API calls in this run"
        default: "5"
  push:
    paths:
      - "pipelines/sam_opportunities.py"
      - ".github/workflows/sam-opportunities.yml"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Fetch
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SAM_CALL_BUDGET: ${{ inputs.budget || '5' }}
        run: |
          set -o pipefail
          python pipelines/sam_opportunities.py 2>&1 | tee fetch.log
      - name: Show log on the run page
        if: always()
        run: |
          { echo '```'; tail -n 20 fetch.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit data
        run: |
          git config user.name "contractorrules-bot"
          git config user.email "contractorrules-bot@users.noreply.github.com"
          git add data/opportunities
          if git diff --cached --quiet; then echo "No change."; else
            git commit -m "Federal construction opportunities: $(python -c "import json;print(json.load(open('data/opportunities/state.json'))['listed'])") listed"
            git pull --rebase && git push
          fi
