name: Source probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe-result.txt 2>&1
          UA="ContractorRules data pipeline (+https://contractorrules.com)"
          p(){ code=$(curl -sL -o /tmp/b -w "%{http_code} %{size_download} %{content_type}" -A "$UA" --max-time 40 "$1" || echo ERR); echo "== $code  $1"; }
          p "https://www.cslb.ca.gov/OnlineServices/DataPortal/ContractorList"
          grep -oiE 'href="[^"]*"' /tmp/b | grep -iE 'download|\.csv|\.zip|\.xls|\.txt|file' | head -30
          grep -oiE '(as of|current as of)[^<]{0,80}' /tmp/b | head -5
          grep -oiE '<input[^>]*(__VIEWSTATE|__EVENTVALIDATION|type="submit")[^>]*>' /tmp/b | cut -c1-160 | head -8
          p "https://sam.gov/api/prod/sgs/v1/search/?index=dbra&page=0&size=5&mode=search&is_active=true&q=&state=CA"
          head -c 1500 /tmp/b; echo
          p "https://sam.gov/api/prod/wdol/v1/wd/CA20260001/0"
          head -c 600 /tmp/b; echo
          p "https://www.dol.gov/agencies/whd/government-contracts/construction"
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe-result.txt && git commit -qm "probe result" && git push -q
