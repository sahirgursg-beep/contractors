name: Source probe
on:
  push:
    paths: [".github/workflows/probe.yml", "probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          exec > probe-result.txt 2>&1
          curl -sL -A "ContractorRules data pipeline (+https://contractorrules.com)" --max-time 60 -D /tmp/h "https://www.sba.gov/sites/default/files/data/naics.json" -o /tmp/n.json -w "== %{http_code} %{size_download}\n"
          grep -iE 'last-modified|content-type' /tmp/h
          python3 probe.py
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe-result.txt && git commit -qm "probe result" && git push -q
