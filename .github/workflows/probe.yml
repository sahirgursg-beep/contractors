name: Source probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe-result.txt 2>&1
          UA="ContractorRules data pipeline (+https://contractorrules.com)"
          curl -s -A "$UA" --max-time 40 "https://data.sba.gov/api/3/action/package_show?id=small-business-size-standards" -o /tmp/p.json -w "pkg %{http_code}\n"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p.json'))['result']
          print(d.get('metadata_modified'))
          for r in d['resources'][:6]:
              print(r.get('name'),'|',r.get('format'),'|',r.get('url'),'|',r.get('last_modified'))
          PY
          u=$(python3 -c "import json;r=json.load(open('/tmp/p.json'))['result']['resources'];print([x['url'] for x in r if x.get('format','').lower()=='json' or x['url'].endswith('.json')][0])")
          curl -s -A "$UA" --max-time 60 "$u" -o /tmp/n.json -w "json %{http_code} %{size_download}\n"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/n.json'))
          print(type(d).__name__, len(d))
          rows=d if isinstance(d,list) else list(d.values())[0]
          print(json.dumps(rows[:2],indent=1)[:1500])
          c=[r for r in rows if str(r.get('id',r.get('naicsCode',''))).startswith('23')]
          print('construction rows', len(c))
          print(json.dumps(c[:3],indent=1)[:1500])
          PY
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe-result.txt && git commit -qm "probe result" && git push -q
