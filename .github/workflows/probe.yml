name: Source probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          exec > probe-result.txt 2>&1
          UA="ContractorRules data pipeline (+https://contractorrules.com)"
          for u in "https://data.sba.gov/dataset/small-business-size-standards" "https://web.data.sba.gov/en/dataset/small-business-size-standards"; do
            curl -sL -A "$UA" --max-time 40 "$u" -o /tmp/p.html -w "== %{http_code} %{size_download} $u\n"
            grep -oiE 'href="[^"]+"' /tmp/p.html | grep -iE 'json|xlsx|naics|download|resource' | sort -u | head -30
          done
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe-result.txt && git commit -qm "probe result" && git push -q
